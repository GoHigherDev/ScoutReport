name: Deploy read-only Mainnet indexer

on:
  workflow_dispatch:
    inputs:
      name:
        description: Maintainer-selected Goldsky subgraph identifier
        type: string
        required: true
      version:
        description: Immutable version label
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-indexer
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: indexer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install --global @goldskycom/cli@13.17.0
      - run: pnpm --filter @scoutreport/subgraph build
      - name: Deploy chiliz manifest only
        env:
          GOLDSKY_API_KEY: ${{ secrets.GOLDSKY_API_KEY }}
          SUBGRAPH_NAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
        run: |
          test -n "$GOLDSKY_API_KEY" || { echo "GOLDSKY_API_KEY is required"; exit 1; }
          echo "::add-mask::$GOLDSKY_API_KEY"
          pnpm --filter @scoutreport/subgraph deploy:chiliz > "$RUNNER_TEMP/indexer.log" 2>&1 || {
            echo "Indexer deployment failed; inspect Goldsky privately."
            exit 1
          }
