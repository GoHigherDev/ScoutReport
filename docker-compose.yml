services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: scoutreport
      POSTGRES_DB: scoutreport
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-dev}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scoutreport -d scoutreport']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
