specVersion: 1.3.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: Scaffold
    network: chiliz-testnet
    source:
      address: '0x0000000000000000000000000000000000000000'
      abi: Scaffold
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities: []
      abis:
        - name: Scaffold
          file: ./abis/Scaffold.json
      blockHandlers:
        - handler: handleBlock
      file: ./src/mapping.ts
