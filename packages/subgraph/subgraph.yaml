specVersion: 1.3.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: NAVI
    network: chiliz
    source:
      address: '0x02728748392F1875682940681F4C936Fc683A68e'
      abi: ERC20
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities: [Token, Account, Holding]
      abis:
        - name: ERC20
          file: ./abis/ERC20.json
      blockHandlers:
        - handler: initialiseToken
          filter:
            kind: once
      file: ./src/mapping.ts
  - kind: ethereum/contract
    name: AFC
    network: chiliz
    source:
      address: '0x76088F3eD5dC655De9295D93868ec1EeC654A615'
      abi: ERC20
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities: [Token, Account, Holding]
      abis:
        - name: ERC20
          file: ./abis/ERC20.json
      blockHandlers:
        - handler: initialiseToken
          filter:
            kind: once
      file: ./src/mapping.ts
  - kind: ethereum/contract
    name: Staking
    network: chiliz
    source:
      address: '0x5ff7f9724fd477d9a07dcdb894d0ca7f8fae1501'
      abi: Staking
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities: [Token, Account, Holding]
      abis:
        - name: Staking
          file: ../chain/abis/staking.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Stake(indexed address,indexed address,uint256)
          handler: handleStake
        - event: Unstake(indexed address,indexed address,uint256,uint256)
          handler: handleUnstake
      file: ./src/staking.ts
templates:
  - kind: ethereum/contract
    name: FanToken
    network: chiliz
    source:
      abi: ERC20
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities: [Token, Account, Holding]
      abis:
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: ./src/mapping.ts
